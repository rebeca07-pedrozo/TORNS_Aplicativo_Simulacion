# Compila el simulador y lo publica en GitHub Pages.
#
# Solo se lanza a mano, desde Actions > Publicar en GitHub Pages > Run workflow.
# Un push a la rama NO publica nada: el sitio se queda en la última versión que
# se publicó a propósito, y los cambios del repositorio no salen hasta que
# alguien lance este flujo.
#
# La dirección del sitio no cambia nunca: GitHub Pages la deriva del nombre del
# repositorio, no del flujo ni de la rama.
name: Publicar en GitHub Pages

on:
  workflow_dispatch:

# Permisos mínimos para que la acción pueda publicar.
permissions:
  contents: read
  pages: write
  id-token: write

# Solo una publicación a la vez. No se corta la que esté en curso: interrumpir
# un despliegue a medias puede dejar Pages en un estado raro.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    name: Construir
    runs-on: ubuntu-latest
    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar tipos
        run: npm run typecheck

      - name: Correr las pruebas del motor
        run: npm test

      - name: Compilar
        run: npm run build

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Subir el sitio compilado
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    name: Publicar
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v4
